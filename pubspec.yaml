name: family_pulse
description: "Мобильное приложение FamilyPulse для защиты и связи членов семьи."
publish_to: 'none'

version: 1.0.31+32

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_database: ^11.1.6
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: 0.10.1
  battery_plus: 7.1.2
  device_apps_ng: ^3.0.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  local_auth_android: ^1.0.42

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700